name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  index:
    # The index is what the client installs from: building every module and
    # emitting it here proves a tag's release can be made.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The tool builds every crate it lists for the target the workspace
      # states, so this is also the "does a module build" check.
      - run: cargo run -p index --locked -- --name official --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: index
          path: dist/
          if-no-files-found: error
