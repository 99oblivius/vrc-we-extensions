name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo run -p index --locked -- --name official --out dist
      # What the release is, checked as one thing: the tag is the version of
      # every module it ships, and every module is the size and hash the
      # index promises.
      - name: the release matches its index
        run: |
          python3 - <<'PY'
          import json, pathlib, os, sys
          dist = pathlib.Path("dist")
          index = json.loads((dist / "index.json").read_text())
          assert index["format"] == 1, index["format"]
          assert index["name"] == "official", index["name"]
          assert index["extensions"], "an index of nothing"
          tag = os.environ["GITHUB_REF_NAME"]
          for entry in index["extensions"]:
              module = dist / entry["wasm"]
              assert module.is_file(), module
              assert module.stat().st_size == entry["size"], entry["name"]
              assert len(entry["sha256"]) == 64, entry["sha256"]
              assert f"v{entry['version']}" == tag, (
                  f"{entry['name']} is {entry['version']}, the tag is {tag}")
          print(f'{len(index["extensions"])} extension(s) at {tag}')
          PY
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
