[package]
name = "camera"
authors = ["oblivius"]
description = "VRChat's user camera as @CAMERA"
license = "MIT"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# It goes in the repository's index: the generator reads this, the version
# and the description from here, so nothing is restated.
[package.metadata.vrc-we]
index = true
mature = false

[dependencies]
vrc-we-sdk = { workspace = true }
glam = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
